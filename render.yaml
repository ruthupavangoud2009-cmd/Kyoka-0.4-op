services:
  - type: web
    name: kyoka-discord-bot
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python -m src.main
    plan: free
    region: virginia
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_PROXY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: BOT_PREFIX
        value: "+"
      - key: SYNC_COMMANDS_ON_STARTUP
        value: "false"
      - key: LAVALINK_AUTO_DISCOVER
        value: "1"
      - key: LAVALINK_PUBLIC_LIST_URL
        value: "https://lavalink-list.ajieblogs.eu.org/All"
      - key: LAVALINK_HOST
        value: "lava2.kasawa.pro"
      - key: LAVALINK_PORT
        value: "2334"
      - key: LAVALINK_SECURE
        value: "false"
      - key: LAVALINK_PASSWORD
        value: "youshallnotpass"
      - key: GEMINI_MODEL
        value: "gemini-flash-lite-latest"
      - key: AI_RESPONSE_TIMEOUT_SECONDS
        value: "15"
      - key: AI_USER_COOLDOWN_SECONDS
        value: "3"
      - key: AI_CHANNEL_COOLDOWN_SECONDS
        value: "2"
      - key: AI_MAX_CONCURRENT_REQUESTS
        value: "5"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
      - key: SHARD_COUNT
        sync: false
      - key: SHARD_IDS
        sync: false
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "5"
